---
layout: default
---
{% assign section = site.data.sections | where: "id", page.section | first %}
<article class="entry">
  <a class="entry-back" href="{{ '/' | relative_url }}#{{ page.section }}">&larr; Back to {{ section.title }}</a>
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<div class="entry-date">{{ page.subtitle }}</div>{% endif %}
  {% if page.image %}
    <div class="entry-image"><img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}"></div>
  {% endif %}
  <div class="entry-body">{{ content }}</div>
</article>
